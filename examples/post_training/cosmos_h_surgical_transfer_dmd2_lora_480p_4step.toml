# COSMOS_H_SURGICAL_DISTILL_TEACHER_DCP must name the preflighted release
# conversion root ending in .dcp. Transfer data uses the standard
# COSMOS_H_SURGICAL_TRANSFER_* environment variables.

[job]
task = "vfm"
experiment = "cosmos_h_surgical_transfer_dmd2_lora_480p_4step"
project = "cosmos_h_surgical"
group = "transfer_dmd2_lora_480p_4step"
name = "cosmos_h_surgical_transfer_dmd2_lora_480p_4step"
wandb_mode = "online"

[model]
max_num_tokens_after_packing = 45056
joint_attn_implementation = "two_way"
lora_enabled = true
lora_rank = 16
lora_alpha = 32
lora_target_modules = "q_proj_moe_gen,k_proj_moe_gen,v_proj_moe_gen,o_proj_moe_gen"
precision = "bfloat16"

[model.ema]
enabled = false

[model.parallelism]
data_parallel_shard_degree = 8
data_parallel_replicate_degree = -1
context_parallel_shard_degree = 1
cfg_parallel_shard_degree = 1

[model.compile]
enabled = false
compile_dynamic = true

[model.activation_checkpointing]
mode = "full"
save_ops_regex = ["fmha"]
preserve_rng_state = true
determinism_check = "default"

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[scheduler]
cycle_lengths = [8000]
f_max = [1.0]
f_min = [0.1]
f_start = [0.0]
verbosity_interval = 0
warm_up_steps = [100]

[trainer]
distributed_parallelism = "fsdp"
grad_accum_iter = 1
logging_iter = 1
max_iter = 8000

[checkpoint]
keys_to_skip_loading = []
load_path = ""
save_iter = 50

[dataloader_train]
max_sequence_length = 45056
