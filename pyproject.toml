[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosmos-h-surgical"
version = "0.3.0"
authors = [
  {name = "NVIDIA Corporation"},
]
description = "Surgical video world modeling with NVIDIA Cosmos 3"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "OpenMDW-1.1"}
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "cosmos-framework[train]",
  "iopath>=0.1.10",
]

[project.scripts]
cosmos-h-surgical = "cosmos_h_surgical.cli:main"

[project.urls]
documentation = "https://github.com/NVIDIA-Medtech/Cosmos-H-Surgical"
homepage = "https://github.com/NVIDIA-Medtech/Cosmos-H-Surgical"
repository = "https://github.com/NVIDIA-Medtech/Cosmos-H-Surgical"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff==0.12.7",
]
cu128 = [
  "flash-attn-3-nv==1.0.3+cu128.torch210; platform_machine == 'x86_64'",
  "flash-attn==2.7.4.post1+cu128.torch210; platform_machine == 'x86_64'",
  "natten==0.21.6.dev6+cu128.torch210; platform_machine == 'x86_64'",
  "torch==2.10.0+cu128",
  "torchao==0.16.0+cu128; platform_machine == 'x86_64'",
  "torchcodec==0.10.0+cu128",
  "torchvision==0.25.0+cu128",
  "transformer-engine==2.12.0+cu128.torch210",
  "triton==3.6.0",
  "nvidia-cublas-cu12==12.8.4.1",
  "nvidia-cuda-cupti-cu12==12.8.90",
  "nvidia-cuda-nvrtc-cu12==12.8.93",
  "nvidia-cuda-runtime-cu12==12.8.90",
  "nvidia-cudnn-cu12==9.10.2.21",
  "nvidia-cufft-cu12==11.3.3.83",
  "nvidia-cufile-cu12==1.13.1.3",
  "nvidia-curand-cu12==10.3.9.90",
  "nvidia-cusolver-cu12==11.7.3.90",
  "nvidia-cusparse-cu12==12.5.8.93",
  "nvidia-cusparselt-cu12==0.7.1",
  "nvidia-nccl-cu12==2.27.5",
  "nvidia-npp-cu12==12.4.1.87",
  "nvidia-nvjitlink-cu12==12.8.93",
  "nvidia-nvshmem-cu12==3.4.5",
  "nvidia-nvtx-cu12==12.8.90",
]
cu130 = [
  "flash-attn-3-nv==1.0.3+cu130.torch210; platform_machine == 'x86_64'",
  "flash-attn==2.7.4.post1+cu130.torch210; platform_machine == 'x86_64'",
  "natten==0.21.6.dev6+cu130.torch210.gb300; platform_machine == 'aarch64'",
  "natten==0.21.6.dev6+cu130.torch210.gb300; platform_machine == 'x86_64'",
  "torch==2.10.0+cu130",
  "torchao==0.16.0+cu130; platform_machine == 'x86_64'",
  "torchcodec==0.10.0+cu130",
  "torchvision==0.25.0+cu130",
  "transformer-engine==2.12.0+cu130.torch210",
  "triton==3.6.0",
  "nvidia-cublas==13.1.0.3",
  "nvidia-cuda-cupti==13.0.85",
  "nvidia-cuda-nvrtc==13.0.88",
  "nvidia-cuda-runtime==13.0.96",
  "nvidia-cudnn-cu13==9.15.1.9",
  "nvidia-cufft==12.0.0.61",
  "nvidia-cufile==1.15.1.6",
  "nvidia-curand==10.4.0.35",
  "nvidia-cusolver==12.0.4.66",
  "nvidia-cusparse==12.6.3.3",
  "nvidia-cusparselt-cu13==0.8.0",
  "nvidia-nccl-cu13==2.28.9",
  "nvidia-npp==13.0.0.50",
  "nvidia-nvjitlink==13.0.88",
  "nvidia-nvshmem-cu13==3.4.5",
  "nvidia-nvtx==13.0.85",
]

[tool.uv]
required-version = ">=0.11.3"
conflicts = [
  [
    {group = "cu128"},
    {group = "cu130"},
  ],
]
override-dependencies = [
  "numpy>=2.0.0,<2.3",
  "lightning; sys_platform == 'never'",
  "pynvml; sys_platform == 'never'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
cosmos-framework = { git = "https://github.com/NVIDIA/cosmos-framework.git", rev = "ed8287fd7477113f8ac4f6b84290514d55cf0cdc" }
flash-attn = { index = "cosmos" }
flash-attn-3-nv = { index = "cosmos" }
lerobot = { git = "https://github.com/mli0603/lerobot.git" }
megatron-core = { git = "https://github.com/NVIDIA/Megatron-LM.git", rev = "de56227" }
natten = { index = "cosmos" }
torch = { index = "pytorch" }
torchao = { index = "pytorch" }
torchcodec = { index = "pytorch" }
torchvision = { index = "pytorch" }
transformer-engine = { index = "cosmos" }
triton = { index = "pytorch" }

[[tool.uv.index]]
name = "cosmos"
url = "https://nvidia-cosmos.github.io/cosmos-dependencies/v1.5.0"
explicit = true

[[tool.uv.index]]
name = "natten"
url = "https://whl.natten.org"
explicit = true
format = "flat"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl"
explicit = true

[tool.hatch.build.targets.sdist]
packages = ["cosmos_h_surgical"]

[tool.hatch.build.targets.wheel]
packages = ["cosmos_h_surgical"]
exclude = ["*_test.py"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
